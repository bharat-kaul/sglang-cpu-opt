<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect width="1240" height="560" fill="#ffffff"/><text x="48" y="34" font-size="21" font-weight="700" fill="#0b2447">DeepSeek-V4-Flash CPU wall-time — baseline vs optimized vs roofline (EMR, GNR)</text><text x="48" y="56" font-size="11.5" fill="#5b6b80">43L two-depth extrapolation (4L+8L dummy proxy, real-router guard). Baseline = fully naive; optimized = all-C/AMX kernels + spin OMP, all cores. B=32, </text><text x="48" y="71" font-size="11.5" fill="#5b6b80">S=128. BLUE dashed = IDEALIZED roofline (prefill: dense-GEMM FLOPs at AMX peak, non-GEMM assumed free; decode: pure weight-streaming / BW-bound). </text><text x="48" y="86" font-size="11.5" fill="#5b6b80">GREEN dashed = ACHIEVABLE time-budget (Σ per-op-class floors; est., pending ablation) — the honest target. Accuracy of this path: gsm8k 0.9437 ≈ GPU </text><text x="48" y="101" font-size="11.5" fill="#5b6b80">0.9535. See the wall-time page for the per-op attribution + refined-roofline derivation. </text><text x="80.0" y="137" font-size="15" font-weight="700" fill="#0b2447">Prefill (TTFT) — compute-bound</text><line x1="80.0" y1="502.0" x2="600.0" y2="502.0" stroke="#eef2f7"/><text x="74.0" y="506.0" font-size="10" fill="#9db0c6" text-anchor="end">0</text><line x1="80.0" y1="422.5" x2="600.0" y2="422.5" stroke="#eef2f7"/><text x="74.0" y="426.5" font-size="10" fill="#9db0c6" text-anchor="end">100</text><line x1="80.0" y1="343.1" x2="600.0" y2="343.1" stroke="#eef2f7"/><text x="74.0" y="347.1" font-size="10" fill="#9db0c6" text-anchor="end">200</text><line x1="80.0" y1="263.6" x2="600.0" y2="263.6" stroke="#eef2f7"/><text x="74.0" y="267.6" font-size="10" fill="#9db0c6" text-anchor="end">300</text><line x1="80.0" y1="184.2" x2="600.0" y2="184.2" stroke="#eef2f7"/><text x="74.0" y="188.2" font-size="10" fill="#9db0c6" text-anchor="end">400</text><line x1="8