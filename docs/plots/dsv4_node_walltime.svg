<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect width="1240" height="560" fill="#ffffff"/><text x="48" y="34" font-size="21" font-weight="700" fill="#0b2447">DeepSeek-V4-Flash CPU wall-time — baseline vs optimized vs roofline (EMR, GNR)</text><text x="48" y="56" font-size="11.5" fill="#5b6b80">43L two-depth extrapolation (4L+8L dummy proxy, real-router guard so routing matches the real ~59 distinct experts/B=32). Baseline = fully naive </text><text x="48" y="71" font-size="11.5" fill="#5b6b80">(eager DSA + OMP spin + no thread-cap). Optimized = all-C/AMX kernels (dispatch-proven) + spin OMP, all cores. B=32, S=128. Roofline from MEASURED EMR </text><text x="48" y="86" font-size="11.5" fill="#5b6b80">constants (pcl-spr08: AMX bf16 12.4 TFLOPS, DRAM 848 GB/s full-node, uarch-probe job 392787). Accuracy of this path: gsm8k 0.9437 ≈ GPU 0.9535. </text><text x="80.0" y="122" font-size="15" font-weight="700" fill="#0b2447">Prefill (TTFT) — compute-bound</text><line x1="80.0" y1="502.0" x2="600.0" y2="502.0" stroke="#eef2f7"/><text x="74.0" y="506.0" font-size="10" fill="#9db0c6" text-anchor="end">0</text><line x1="80.0" y1="419.1" x2="600.0" y2="419.1" stroke="#eef2f7"/><text x="74.0" y="423.1" font-size="10" fill="#9db0c6" text-anchor="end">100</text><line x1="80.0" y1="336.3" x2="600.0" y2="336.3" stroke="#eef2f7"/><text x="74.0" y="340.3" font-size="10" fill="#9db0c6" text-anchor="end">200</text><line x1="80.0" y1="253.4" x2="600.0" y2="253.4" stroke="#eef2f7"/><text x="74.0" y="257.4" font-size="10" fill="#9db0c6" text-anchor="end">300</text><line x1="80.0" y1="170.6" x2="600.0" y2="170.6" stroke="#eef2f7"/><text x="74.0" y="174.6" font-size="10" fill="#9db0c6" text-anchor="end">400</text><line x1="80.0" y1="163.1" x2="600.0" y2="163.1" stroke="#1b6ca8" stroke-width="2" stroke-dasharray="7 5"/><text x="80.0" y="157.1" font-size="10.5" font-weight="600"