<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect width="1240" height="560" fill="#ffffff"/><text x="48" y="34" font-size="21" font-weight="700" fill="#0b2447">DeepSeek-V4-Flash CPU wall-time — baseline vs optimized vs roofline (EMR, GNR)</text><text x="48" y="56" font-size="11.5" fill="#5b6b80">43L two-depth extrapolation (4L+8L dummy proxy, real-router guard so routing matches the real ~59 distinct experts/B=32). Baseline = fully naive </text><text x="48" y="71" font-size="11.5" fill="#5b6b80">(eager DSA + OMP spin + no thread-cap). Optimized = all-C/AMX kernels (dispatch-proven) + spin OMP, all cores. B=32, S=128. Roofline from MEASURED EMR </text><text x="48" y="86" font-size="11.5" fill="#5b6b80">constants (pcl-spr08: AMX bf16 12.4 TFLOPS, DRAM 848 GB/s full-node, uarch-probe job 392787). Accuracy of this path: gsm8k 0.9437 ≈ GPU 0.9535. NB: </text><text x="48" y="101" font-size="11.5" fill="#5b6b80">the prefill roofline is an IDEALIZED upper bound (linear-layer dense-GEMM FLOPs at AMX peak) — only ~40% of real prefill wall-time is that GEMM; ~60% </text><text x="48" y="116" font-size="11.5" fill="#5b6b80">(glue/eager-math/fallback-matmul) is assumed free. See the wall-time page&#x27;s prefill-headroom analysis. </text><text x="80.0" y="152" font-size="15" font-weight="700" fill="#0b2447">Prefill (TTFT) — compute-bound</text><line x1="80.0" y1="502.0" x2="600.0" y2="502.0" stroke="#eef2f7"/><text x="74.0" y="506.0" font-size="10" fill="#9db0c6" text-anchor="end">0</text><line x1="80.0" y1="425.9" x2="600.0" y2="425.9" stroke="#eef2f7"/><text x="74.0" y="429.9" font-size="10" fill="#9db0c6" text-anchor="end">100</text><line x1="80.0" y1="349.9" x2="600.0" y2="349.9" stroke="#eef2f7"/><text x="74.0" y="353.9" font-size="10" fill="#9db0c6" text-anchor="end">200</text><line x1="80.0" y1="273.8" x2="600.0" y2="273.8" stroke="#eef2f7"/><text x="74.0" y=