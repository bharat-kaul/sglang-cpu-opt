<text x="70" y="510" font-size="11" fill="#9db0c6">Solid = measured (teal) · ghost = pending · dashed = BW roofline. Deltas from a controlled held-fixed A/B (off vs on, same job/config). Data: results/e2e_decode_progression.json.</text>
