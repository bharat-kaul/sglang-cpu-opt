<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="1180" height="520" fill="#ffffff"/>
<text x="70" y="36" font-size="22" font-weight="700" fill="#0b2447">Decode (TPOT) wall-time progression vs roofline</text>
<text x="70" y="60" font-size="13" fill="#5b6b80">Perf-proxy (4-layer dummy) B=32 decode tok/s as the authored kernels integrate (one at a time) then the E2E optimizations land. Higher is better.</text>
<text x="70" y="78" font-size="12.5" fill="#8a4b00">Full-node (all NUMA, 128c) = the max-throughput config (single-NUMA per-rank is 2.8× lower). Gap to roof = ~40% unoptimized torch DSA/MHC decode ops → port them + MoE thread-cap.</text>
