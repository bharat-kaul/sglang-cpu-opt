<text x="35" y="557" font-size="13" text-anchor="start" fill="#17324d">Bars: existing measurements, jobs EMR402060 / GNR402075; baseline: dummy-weight 4L/8L extrapolation.</text>
<text x="35" y="587" font-size="13" text-anchor="start" fill="#17324d">Not a controlled baseline speedup comparison. EMR uses 64 cores; GNR uses 96 of 128 cores.</text>
<text x="35" y="617" font-size="13" text-anchor="start" fill="#17324d">Targets are conditional predictions, not measured ceilings, confidence intervals or optimality certificates.</text>
<text x="35" y="647" font-size="13" text-anchor="start" fill="#17324d">Source-derived native bytes and observed forward shapes + hardware calibration402525/402526;</text>
<text x="35" y="677" font-size="13" text-anchor="start" fill="#17324d">assumed routing, SIMD conversion/issue rate, fusion and utilization. No new full-model runs.</text>
<text x="35" y="707" font-size="13" text-anchor="start" fill="#17324d">A cautious stress scenario is contradicted by existing throughput; retained in the detailed report.</text>
