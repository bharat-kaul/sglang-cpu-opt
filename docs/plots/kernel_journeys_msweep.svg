<text x="26" y="34" font-size="21" font-weight="700" fill="#0b2447">Optimization journey across the M sweep — how the speed-up holds vs batch</text>
<text x="26" y="56" font-size="13" fill="#5b6b80">Baseline (torch) vs shipped kernel across the M=1..64 sweep, streaming (LLC-flushed), 3-replicate median (EMR). Gap between the lines = speed-up; it</text>
<text x="26" y="73" font-size="13" fill="#5b6b80">MOVES with M (adaptive tile, low-M serial dispatch, ISA crossover). Dashed = nominal roofline floor where that is the right ceiling. Log-log; lower is</text>
<text x="26" y="90" font-size="13" fill="#5b6b80">better.</text>
