<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect width="1120" height="540" fill="#ffffff"/><text x="70" y="36" font-size="22" font-weight="700" fill="#0b2447">DeepSeek-V4-Flash CPU gsm8k accuracy — real port bug found &amp; fixed</text><text x="70" y="58" font-size="12.5" fill="#5b6b80">8-shot CoT, same post-trained Flash checkpoint + protocol as the GPU oracle. A silent wkv_gate weight-prepack permutation in the </text><text x="70" y="75" font-size="12.5" fill="#5b6b80">DSA compressor was localized (boundary-capture + reference-replay) and fixed in 3 steps. </text><line x1="70" y1="436.0" x2="1096" y2="436.0" stroke="#eef2f7"/><text x="62" y="440.0" font-size="11" fill="#9db0c6" text-anchor="end">0.0</text><line x1="70" y1="368.0" x2="1096" y2="368.0" stroke="#eef2f7"/><text x="62" y="372.0" font-size="11" fill="#9db0c6" text-anchor="end">0.2</text><line x1="70" y1="300.0" x2="1096" y2="300.0" stroke="#eef2f7"/><text x="62" y="304.0" font-size="11" fill="#9db0c6" text-anchor="end">0.4</text><line x1="70" y1="232.0" x2="1096" y2="232.0" stroke="#eef2f7"/><text x="62" y="236.0" font-size="11" fill="#9db0c6" text-anchor="end">0.6</text><line x1="70" y1="164.0" x2="1096" y2="164.0" stroke="#eef2f7"/><text x="62" y="168.0" font-size="11" fill="#9db0c6" text-anchor="end">0.8</text><line x1="70" y1="96.0" x2="1096" y2="96.0" stroke="#eef2f7"/><text x="62" y="100.0" font-size="11" fill="#9db0c6" text-anchor="end">1.0</text><text x="18" y="266" font-size="12" fill="#5b6b80" transform="rotate(-90 18 266)" text-anchor="middle">gsm8k accuracy (8-shot CoT)</text><line x1="70" y1="111.8" x2="1096" y2="111.8" stroke="#1b6ca8" stroke-width="2" stroke-dasharray="7 5"/><text x="70" y="104.8" font-size="12.5" font-weight="600" fill="#1b6ca8" text-anchor="start">GPU oracle (same checkpoint, same 8-shot protocol) — 0.9535</text><rect x="70.0" y="165.4" width="302.0" height="270.6" fill="#c0504d" rx="3"/><text x="221.0" y="155.4" font-size="19" font-weight="700" fill="#c0504d" text-anchor="middle">0.796</text><text x="221.0" y="185.4" font-size="11.5" fill="#ffffff" text-anchor="middle">83% of GPU</text><text x="221.0" y="458.0" font-size="13" font-weight="600" fill="#0b2447" text-anchor="middle">CPU baseline</text><text x="221.0" y="476.0" font-size="11" fill="#5b6b80" text-anchor="middle">pre-fix (compressed attn broken)</text><rect x="432.0" y="141.9" width="302.0" height="294.1" fill="#d08a1d" rx="3"/><text x="583.0" y="131.9" font-size="19" font-weight="700" fill="#d08a1d" text-anchor="middle">0.865</text><text x="583.0" y="161.9" font-size="11.5" fill="#ffffff" text-anchor="middle">91% of GPU</text><text x="583.0" y="458.0" font-size="13" font-weight="600" fill="#0b2447" text-anchor="middle">+ wkv_gate row-major</text><text x="583.0" y="476.0" font-size="11" fill="#5b6b80" text-anchor="middle">prefill correct (layer-2 cos 0.9997)</text><rect x="794.0" y="115.1" width="302.0" height="320.9" fill="#2f6f4f" rx="3"/><text x="945.0" y="105.1" font-size="19" font-weight="700" fill="#2f6f4f" text-anchor="middle">0.944</text><text x="945.0" y="135.1" font-size="11.5" fill="#ffffff" text-anchor="middle">99% of GPU</text><text x="945.0" y="458.0" font-size="13" font-weight="600" fill="#0b2447" text-anchor="middle">+ decode persist +</text><text x="945.0" y="474.0" font-size="13" font-weight="600" fill="#0b2447" text-anchor="middle">request-aware mask</text><text x="945.0" y="492.0" font-size="11" fill="#5b6b80" text-anchor="middle">302/320, all 8 shards PASS</text></svg>