<text x="40" y="34" font-size="22" font-weight="bold">DSv4: Baseline vs EMR optimized vs GNR</text>
<text x="40" y="59" font-size="14">B32 / S128 per replica. Higher throughput is better.</text>
<rect x="40" y="76" width="1020" height="45" fill="#fff3d6"/>
<text x="52" y="95" font-size="13" font-weight="bold">Cross-experiment comparison: baseline is a dummy-weight proxy; current EMR/GNR use real weights.</text>
<text x="52" y="113" font-size="12">Different host/configuration and timing protocols. Do not read baseline-to-current bar ratios as controlled speedups.</text>
<rect x="50" y="138" width="14" height="14" fill="#8994a5"/>
<text x="72" y="150" font-size="13">Naive baseline (historical proxy)</text>
<rect x="405" y="138" width="14" height="14" fill="#2473ad"/>
<text x="427" y="150" font-size="13">EMR optimized (real, 2 replicas)</text>
<rect x="750" y="138" width="14" height="14" fill="#38835b"/>
<text x="772" y="150" font-size="13">GNR (real, 3 replicas)</text>
<text x="285" y="190" text-anchor="middle" font-size="18" font-weight="bold">Prefill tokens/s</text>
<text x="815" y="190" text-anchor="middle" font-size="18" font-weight="bold">Decode tokens/s</text>
