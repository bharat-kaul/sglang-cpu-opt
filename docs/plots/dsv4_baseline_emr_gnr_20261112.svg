<text x="40" y="480" font-size="13">Current EMR/GNR: 43 real layers, fixed32 threads per replica, five output tokens (four decode steps).</text>
<text x="40" y="501" font-size="13">Real-weight bars: three socket-round medians; ranges are in the table. Not steady-state or tuned-optimum rates.</text>
<text x="40" y="522" font-size="13">EMR: 64 cores / total B64. GNR: 96 of 128 cores / total B96. Same native main computation, no C4.</text>
<text x="40" y="543" font-size="13">Baseline: original 4L/8L-to-43L extrapolation, not a current measured median. Historical record: job 392780.</text>
<text x="40" y="564" font-size="12">Current jobs: EMR 402060 / GNR 402075. Matched GNR/EMR phase ratios: prefill 1.694x, decode 1.182x.</text>
