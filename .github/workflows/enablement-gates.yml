name: enablement-gates

on:
  push:
    paths:
      - "plugin/validate/enablement_gate.py"
      - "plugin/validate/peer_roofline.py"
      - "plugin/validate/test_enablement_gate.py"
      - "plugin/validate/run_enablement_phase.py"
      - "plugin/validate/test_phase_recovery.py"
      - "plugin/validate/test_peer_roofline.py"
      - "plugin/validate/*socket*roofline*.py"
      - "plugin/validate/*calibrate_socket_targets.py"
      - "plugin/validate/results/dsv4_socket_roofline*.json"
      - "plugin/validate/results/dsv4_socket_calibration_*.json"
      - "plugin/validate/*dummy_checkpoint.py"
      - "plugin/validate/*diff_fullcap.py"
      - "plugin/validate/_smoke.py"
      - "plugin/_dummy_determinism.py"
      - "plugin/_fullcap_io.py"
      - "plugin/gpu_ref_hook/**"
      - "plugin/intel_cpu_models/__init__.py"
      - "plugin/intel_cpu_models/_glm5_cpu_infra.py"
      - "plugin/intel_cpu_models/_dsv4_cpu_infra.py"
      - ".agents/**"
      - "docs/methodology-playbook.md"
      - ".github/workflows/enablement-gates.yml"
  pull_request:
    paths:
      - "plugin/validate/enablement_gate.py"
      - "plugin/validate/peer_roofline.py"
      - "plugin/validate/test_enablement_gate.py"
      - "plugin/validate/run_enablement_phase.py"
      - "plugin/validate/test_phase_recovery.py"
      - "plugin/validate/test_peer_roofline.py"
      - "plugin/validate/*socket*roofline*.py"
      - "plugin/validate/*calibrate_socket_targets.py"
      - "plugin/validate/results/dsv4_socket_roofline*.json"
      - "plugin/validate/results/dsv4_socket_calibration_*.json"
      - "plugin/validate/*dummy_checkpoint.py"
      - "plugin/validate/*diff_fullcap.py"
      - "plugin/validate/_smoke.py"
      - "plugin/_dummy_determinism.py"
      - "plugin/_fullcap_io.py"
      - "plugin/gpu_ref_hook/**"
      - "plugin/intel_cpu_models/__init__.py"
      - "plugin/intel_cpu_models/_glm5_cpu_infra.py"
      - "plugin/intel_cpu_models/_dsv4_cpu_infra.py"
      - ".agents/**"
      - "docs/methodology-playbook.md"
      - ".github/workflows/enablement-gates.yml"

jobs:
  adversarial-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing peer-validator dependency
        run: python -m pip install PyYAML
      - name: Exercise real gate entrypoints with synthetic evidence
        working-directory: plugin/validate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest test_enablement_gate test_peer_roofline test_phase_recovery test_calibrate_socket_targets test_model_socket_roofline

  tp-oracle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU oracle dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy safetensors
      - name: Check generation, capture binding and adversarial comparisons
        working-directory: plugin/validate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          OMP_NUM_THREADS: "1"
        run: python -m unittest test_dummy_checkpoint test_diff_fullcap
