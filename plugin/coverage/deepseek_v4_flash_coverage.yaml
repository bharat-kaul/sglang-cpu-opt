# Coverage-Gate Report — DeepSeek Flash v4.1 (DeepSeek-V4 arch) on Intel Xeon 6980P
# Produced by the model-enablement workflow (coverage-gate skill), 2026-09-10.
# This model is the NEW-KERNEL-leg flagship: most ops reuse existing CPU/AMX kernels
# (inherited from the DeepSeek-V2 CPU path), but DeepSeek Sparse Attention (DSA)
# introduces a small, bounded set of ops whose AMX kernels are missing on CPU.
#
# Verdict legend:
#   COVERED  - an existing CPU/AMX kernel satisfies the op's contract
#   PARTIAL  - runs on CPU but only via an AVX-512 fallback; AMX kernel missing ->
#              functional but FAILS the peer-relative/roofline performance gate
#   GAP      - no CPU kernel; needs a net-new AMX kernel (new-kernel leg)

model: DeepSeek-Flash-v4.1
arch: DeepseekV4ForCausalLM
node_profile: gnr_6980p
overall_verdict: GAP                 # -> route the gap/partial ops to cpu-optimizer
summary: "MLA core, dense GEMMs, MoE, norm, rope, fp8 dense GEMM all COVERED via the
  DeepSeek-V2 CPU path. The DSA 'lightning indexer' + compressor + fp8-group-quant/
  Hadamard query path are the ONLY new work: 1 PARTIAL (AMX decode kernel missing)
  + 3 GAP ops. Tightly bounded — one kernel family."

# ---- Architecture facts (sglang/srt/configs/deepseek_v4.py) ----
config_facts:
  mla: {q_lora_rank: 1024, kv_lora_rank: 512, qk_nope_head_dim: 448, qk_rope_head_dim: 64, v_head_dim: 512, num_attention_heads: 64}
  dsa_indexer: {index_head_dim: 128, index_n_heads: 64, index_topk: 512}   # top-512 token selection
  moe: {num_experts_per_tok: 6, topk_group: 8, topk_method: noaux_tc}

# ---- Op decomposition + per-op CPU coverage ----
ops:
  - {op: dense_gemm (q_a/q_b/kv_a/kv_b/o_proj), verdict: COVERED,
     kernel: amx_brgemm_bf16/fp8, evidence: "csrc/cpu/gemm.cpp, gemm_fp8.cpp", donor: deepseek_v2}
  - {op: mla_attention_core (absorbed), verdict: COVERED,
     kernel: fused_mla_rope_cpu + flash_attn, evidence: "csrc/cpu/flash_attn.cpp; models/deepseek_common/.../forward_mla_fused_rope_cpu.py", donor: deepseek_v2}
  - {op: moe_grouped_gemm (noaux_tc, top-6), verdict: COVERED,
     kernel: fused_moe_cpu_amx, evidence: "csrc/cpu/moe.cpp, moe_fp8.cpp", donor: deepseek_v2/qwen2_moe}
  - {op: rms_norm, verdict: COVERED, kernel: cpu_rms_norm, evidence: "csrc/cpu/norm.cpp", donor: llama/deepseek_v2}
  - {op: rope, verdict: COVERED, kernel: cpu_rotary, evidence: "csrc/cpu/rope.cpp", donor: llama/deepseek_v2}
  - {op: topk_selection (indexer top-512), verdict: COVERED,
     kernel: cpu_topk, evidence: "csrc/cpu/topk.cpp", donor: deepseek_v2}

  # ---- The DSA-specific new work ----
  - op: dsa_indexer_logits_gemm (decode, M=16)
    verdict: PARTIAL
    reason: "index_gemm_kernel_nn/nt exist in AVX-512 (csrc/cpu/decode.cpp:831,986) but the
      AMX tile kernel for the M=16 decode case is explicitly UNWRITTEN"
    evidence: "csrc/cpu/decode.cpp:13  // TODO: provide amx kernel for index_gemm_kernel_nn when M = 16"
    impact: "lightning-indexer decode is a per-step hot path; AVX-512 fallback misses the
      roofline -> would FAIL peer-relative roofline. This is the PRIMARY kernel to write."
  - op: kv_compressor (indexer KV compression)
    verdict: GAP
    reason: "compress kernels are Triton/CUDA/HIP only; no csrc/cpu compressor file"
    evidence: "kernels/ops/attention/dsv4/compress.py, fused_compress_triton.py; srt/layers/attention/dsv4/compressor.py (+ compress_hip.py); csrc/cpu has NO compress source"
  - op: fp8_group_quant + hadamard (indexer query proj)
    verdict: GAP
    reason: "fused_q_indexer_rope_hadamard_quant / fp8 per-token-group quant have no CPU AMX kernel"
    evidence: "kernels/ops/attention/dsv4/{fp8_wo_a.py, fp4_indexer.py}; imports in srt/layers/attention/dsv4/indexer.py:18-30"
  - op: sparse_prefill_attention (indexer-selected sparse attn, prefill)
    verdict: GAP
    reason: "sparse-prefill selection kernels are Triton only; no CPU sparse-prefill path"
    evidence: "kernels/ops/attention/dsv4/sparse_prefill_kernels.py; srt/layers/attention/dsv4/sparse_prefill_utils.py"

# ---- Scaffolding tasks handed to the cpu-optimizer (new-kernel leg) ----
# Each is bounded and has a donor kernel to adapt, so the agent starts warm.
scaffolding_tasks:
  - id: dsa-amx-index-gemm-decode         # PRIMARY, unblocks perf
    op: dsa_indexer_logits_gemm
    goal: "AMX tile kernel for index_gemm_kernel_nn at M=16 (decode)"
    contract:
      A: {shape: "[M<=16, K=index_head_dim=128]", dtype: fp32, role: indexer query}
      B: {shape: "[K, N]", dtype: fp8_e4m3, scale: per-group, role: indexed KV (gather via indices)}
      C: {shape: "[M, N]", dtype: fp32, role: lightning-indexer logits}
      notes: "gather rows via `indices`, top-512 downstream; N is vectorizable (mult of 16)"
    donor_to_adapt: "AVX-512 index_gemm_kernel_nn (csrc/cpu/decode.cpp:986) + AMX BRGEMM pattern (csrc/cpu/gemm.cpp)"
    skills: [amx-vectorization, cache-blocking-tiling, weight-prepacking-brgemm, roofline-validation]
    gate: "eff vs achievable ceiling >= target; peer-relative vs an existing AMX fp8/int8 gemm"
  - id: dsa-amx-compressor
    op: kv_compressor
    goal: "CPU AMX KV-compression kernel for the indexer"
    donor_to_adapt: "compress_hip.py logic + csrc/cpu gemm/quant primitives"
    skills: [amx-vectorization, quantization-amx-int8, cache-blocking-tiling]
  - id: dsa-cpu-fp8-group-quant-hadamard
    op: fp8_group_quant + hadamard
    goal: "CPU per-token-group fp8 quant + Hadamard for the indexer query path"
    donor_to_adapt: "ops/attention/dsv4/fp8_wo_a.py (Triton) semantics; csrc/cpu gemm_fp8.cpp quant helpers"
    skills: [amx-vectorization, quantization-amx-int8]
  - id: dsa-cpu-sparse-prefill
    op: sparse_prefill_attention
    goal: "CPU sparse-prefill attention over indexer-selected tokens"
    donor_to_adapt: "sparse_prefill_kernels.py (Triton) + csrc/cpu/flash_attn.cpp"
    skills: [amx-vectorization, cache-blocking-tiling, openmp-parallelization]

# ---- CPU INFRA GAPS found empirically during make-it-work (2026-09-15) ----
# The coverage-gate above enumerated the DSA COMPUTE-op gaps. Standing the model up on
# CPU (plugin wrapper + dummy fp8 weights, sglang 0.5.20.dev373) surfaced an ADDITIONAL
# category the static op-scan missed: the KV-cache / memory-pool + attention-backend
# wiring for DSA on CPU. These block make-it-work before any DSA compute kernel runs.
cpu_infra_gaps:
  - id: dsv4-cpu-fp8-kv-guard
    where: "srt/mem_cache/kv_cache_configurator.py:313 configure()"
    symptom: "ValueError: CPU FP8 KV cache requires the intel_amx attention backend"
    cause: "generic CPU-fp8-KV guard assumes fp8 KV == MHA + intel_amx backend; does NOT
      exempt DSV4's custom MLA packed pool (which legitimately stores fp8+bf16 as uint8).
      Fires on CPU only (current_platform.is_cpu() gated); CUDA path is unaffected."
    fix_direction: "plugin-side: exempt the DSV4 dsv4-backend MLA pool from the generic
      fp8-MHA-intel_amx guard, or wire the CPU attention backend selection so DSV4 gets a
      supported (backend, kv-pool) pair. Framework change kept in the plugin (no sglang fork)."
  - id: dsv4-cpu-kv-pool-store-dtype
    where: "srt/mem_cache/deepseek_v4_memory_pool.py:138 create_buffer()"
    symptom: "AssertionError: store_dtype == torch.uint8 (when kv-cache-dtype overridden to bf16)"
    cause: "DSV4 KV pool is hardwired to the packed byte layout (448 fp8 nope + 64*2 bf16
      rope + 7 fp8 scales + 1 pad = 584 B/token, store_dtype uint8). --kv-cache-dtype cannot
      override it; bf16 KV is not a valid DSV4 layout."
    note: "=> DSV4 CPU KV must use the native packed fp8 pool; the real work is making that
      pool + its accessors (dsv4_index_buf_accessor) run on CPU, not forcing bf16."
  scope_impact: "Thesis-2 DSA work = 4 DSA compute kernels (coverage-gate) PLUS this KV/
    memory-pool + backend-wiring layer. The make-it-work reference layer must land the
    infra first (so the model executes), then model-profile-hotspots ranks which DSA
    compute kernel to author in AMX."

# ---- FULL dsv4-backend kernel scope (enablement-scope-discovery closure, 2026-09-15) ----
# Dependency-closure grep of kernels/ops/attention/dsv4/*.py: the dsv4 attention BACKEND
# has its own DSV4-specific kernel set (NOT the deepseek_v2 CPU path coverage assumed).
# Each is JIT-CUDA / sgl_kernel / Triton with no CPU path unless noted. Honest remaining scope:
dsv4_backend_kernel_scope:
  mla_core_norm_rope:   # small torch ports (RMS-norm + rope math)
    - fused_q_norm_rope            # elementwise.py:144 (JIT) — CURRENT FRONTIER
    - fused_k_norm_rope_flashmla   # elementwise.py:267 (JIT)
    - fused_rope_inplace           # elementwise.py:113 (JIT)
  kv_quant_pack:
    - quant_to_nope_fp8_rope_bf16_pack  # quant_k_cache.py:72 (Triton) — fp8 KV pack
    - fused_store_cache                 # attn.py:63 (JIT)
  moe_routing:
    - _jit_mask_topk / _jit_hash_topk   # moe.py:20/29 (JIT) — hash/mask top-k
    - silu_and_mul_clamp                # moe.py:182 (sgl_kernel)
  topk_transform:
    - topk_transform_paged/ragged/v2    # topk.py (JIT/sgl_kernel; some torch variants exist)
  dsa_family:   # (see ops table above) compressor=authoring; indexer has torch fallback
    - compress_forward/plan/norm_rope_store, sparse_prefill, index_gemm(M16)
  classification: "MOSTLY routing/small-port (norm/rope/quant/pack/topk = portable math);
    the compressor PLAN is the one true authoring gap. Lesson: the dsv4 BACKEND replaces the
    deepseek_v2 MLA CPU path wholesale — 'MLA covered via deepseek_v2' was WRONG for this backend.
    Either port the dsv4 kernel set OR route DSV4 core attention to the intel_amx CPU MLA backend."

# ---- SECOND novel kernel family found by bring-up (2026-09-15): MHC ----
# The coverage-gate op-scan enumerated DSA (attention subsystem) but MISSED MHC — the
# DeepSeek-V4 hash-clustering in the NORM path (config num_hash_layers=3, hc_mult=4,
# hc_sinkhorn_iters=20). A second, independent novel kernel family:
mhc_hash_clustering:
  where: "models/deepseek_v4.py hc_pre/hc_post; kernels/ops/layernorm/mhc.py"
  status: GAP
  ops: [mhc_pre, hc_split_sinkhorn, hc_combine, mhc_post]
  reason: "TileLang-only (tilelang not installed on CPU). hc_pre has a torch outer frag
    (hc_pre_torch_impl) but inner hc_split_sinkhorn + hc_combine are TileLang kernels."
  note: "sinkhorn normalize + weighted combine are portable math -> torch CPU port is
    small/bounded. Lesson: a model can have >1 novel kernel FAMILY in different
    subsystems (DSA=attention, MHC=norm); scan the whole forward to the sub-op leaf."

# ---- Make-it-work ladder cleared so far (login node + GNR, dummy fp8) ----
# 1) config schema  -> base config.json on transformers-native DSV4 schema (Pro config.json)
# 2) wo_a.weight_scale_inv assert -> DSV4 MLA REQUIRES fp8 block-quant (keep quantization_config)
# 3) vllm._custom_ops rope import -> set SGLANG_USE_CPU_ENGINE=1 (is_cpu() gate)
# 4) MODEL BUILDS + LOADS end-to-end on CPU in fp8 (MLA + DSA indexer + MoE instantiate)
# 5) [CURRENT] KV-cache/memory-pool + backend wiring (the two cpu_infra_gaps above)

# ---- What this demonstrates ----
# The analyzer, run same-day on a high-profile release, pinpoints EXACTLY the missing
# CPU work and matches the in-tree TODO (decode.cpp:13). Enablement is NOT blocked by
# the whole model — only a bounded DSA kernel family (1 PARTIAL + 3 GAP) needs the
# new-kernel leg; everything else is already covered. This is why DeepSeek-V4 belongs
# in the new-kernel leg, not the throughput (all-known-kernels) leg.
