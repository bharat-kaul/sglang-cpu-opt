<text x='784.7' y='450.0' font-size='10.5' fill='#555' text-anchor='middle'>AMX bf16 dense-GEMM ceiling</text>
<text x='360.7' y='103.2' font-size='14' font-weight='bold' fill='#2f6f4f' text-anchor='middle'>7.2×</text>
<text x='78' y='494' font-size='11' fill='#555'>7.2× achieved (55.5→7.7s), faithful (prefill+decode parity: logits cos 0.9999, identical tokens). The dense-GEMM</text>
<text x='78' y='509' font-size='11' fill='#555'>roofline (0.09s) is the hardware compute ceiling but is NOT reachable: the gated-delta KDA recurrence is</text>
<text x='78' y='524' font-size='11' fill='#555'>dispatch/small-op bound (even the native AMX kernel = parity with torch compute), so the realistic floor is ~4s via a</text>
<text x='78' y='539' font-size='11' fill='#555'>fused CPU KDA kernel. Router 27→0.1s = warming the CPU @torch.compile (bit-exact), not an eager bypass; KDA 24.6→3.7s =</text>
<text x='78' y='554' font-size='11' fill='#555'>chunked matmuls (WY form).</text>
