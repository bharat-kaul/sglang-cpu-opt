<text x='767.3' y='426.0' font-size='14' font-weight='bold' text-anchor='middle'>Roofline</text>
<text x='767.3' y='444.0' font-size='11' fill='#555' text-anchor='middle'>stream_triad ceiling</text>
<text x='351.3' y='140.7' font-size='13' font-weight='bold' fill='#2f6f4f' text-anchor='middle'>2.9× — batch amortization (operating point)</text>
<text x='74' y='486' font-size='11' fill='#555'>Operating-point chart, NOT an optimization delta: a larger batch amortizes &amp; dedups expert-weight streaming over more</text>
<text x='74' y='501' font-size='11' fill='#555'>tokens, so achieved BW rises with M (arithmetic intensity, not a kernel change). Implementation optimizations</text>
<text x='74' y='516' font-size='11' fill='#555'>(spin-wait fix 63x prefill / 10x decode, thread-cap, native-MXFP4) are a separate fixed-workload before/after story.</text>
<text x='74' y='531' font-size='11' fill='#555'>At M=32 the kernel reaches 75% of the stream ceiling.</text>
