# Enablement Certificate — OLMoE-1B-7B on Intel Xeon 6980P (GNR)
# Emitted by the model-enablement workflow (throughput-thesis leg), 2026-09-11.
# Sparse MoE (top-8 of 64 experts) — exercises the FusedMoE CPU grouped-GEMM path.

model: allenai/OLMoE-1B-7B-0924        # local: /scratch/bkaul/models/OLMoE-1B-7B-0924
config_hash: hidden2048-L16-H16-KV16-E64-top8-I1024-V50304
node_profile: gnr_6980p                # Intel Xeon 6980P, pcl-gnrap01
plugin_commit: intel_cpu_models/olmoe_cpu.py (generated)
dtype: bf16
verdict: GREEN                         # coverage + accuracy(parity+task) + dispatch + throughput

coverage:
  verdict: ALL_COVERED
  ops:
    - {op: dense_gemm (qkv/o),  kernel: amx_brgemm_bf16_prepacked,        donor: llama3_8b,          verdict: COVERED}
    - {op: gqa_attention,       kernel: intel_amx_attention_backend,      donor: llama3_8b,          verdict: COVERED}
    - {op: moe_grouped_gemm,    kernel: fused_moe_cpu_amx,                donor: qwen2_moe/deepseek, verdict: COVERED}
    - {op: rms_norm,            kernel: cpu_rms_norm,                     donor: llama3_8b,          verdict: COVERED}
    - {op: qk_norm,             kernel: cpu_rms_norm,                     donor: olmoe,              verdict: COVERED}
    - {op: rope,                kernel: cpu_rotary,                       donor: llama3_8b,          verdict: COVERED}
    - {op: swiglu,              kernel: cpu_silu_and_mul,                 donor: llama3_8b,          verdict: COVERED}
    - {op: embed_and_head,      kernel: vocab_parallel_embedding_prepacked, donor: llama3_8b,        verdict: COVERED}
  fallbacks: []

accuracy:
  reference: hf_transformers_bf16
  parity_next_token:
    prompts: 12
    top1_agreement: 1.0
    tolerance: {agree_min: 0.9}
    verdict: PASS
    evidence: plugin/validate/results/olmoe_accuracy.json
  task:
    gsm8k: {num_questions: 100, num_shots: 8, accuracy: 0.19, invalid: 0, latency_s: 19.3,
            verdict: PASS, note: "1B-active base model — low but sane; matches HF-class behavior",
            evidence: plugin/validate/results/olmoe_gsm8k.json}
    mmlu:  {status: FOLLOW_UP}

dispatch:
  isa_confirmed: true
  evidence: "AMX active on node (torch._is_amx_tile_supported / cpu_has_amx_support / unquant._is_cpu_amx_available all True); FusedMoE CPU AMX path"

performance:
  # OLMoE's hidden=2048 makes its dense GEMMs SMALL; the SAME AMX kernel runs at a
  # naturally lower absolute efficiency than the larger-shape donors (a shape effect,
  # NOT a wiring loss). Correctness (1.0 parity) + high throughput confirm the wiring.
  dense_gemm_raw:
    - {op: qkv, K: 2048, N: 6144, achieved_tflops: 20.57, eff_abs_vs_streamed: 0.339}
    - {op: o,   K: 2048, N: 2048, achieved_tflops: 4.98,  eff_abs_vs_streamed: 0.082}
  peer_relative:
    verdict: "shared-kernel (same AMX kernels certified GREEN on OLMo2/Llama); cross-model
      per-op eff_rel not apples-to-apples due to OLMoE's unique small hidden (2048).
      In-SGLang MoE per-op profiling vs a same-shape self-baseline = FOLLOW_UP."
  end_to_end:                          # in-SGLang serving, TP=1, single socket
    prefill_tok_s: 7629.1
    decode_tok_s: 251.0                # ~2.8x OLMo-2-7B decode: only ~1B of 7B params active
    prefill_achieved_tflops: 18.0
    linear_gflops_per_token: 2.36
    evidence: plugin/validate/results/olmoe_throughput.json

determinism:
  sampling: greedy_temp0
  repeats: 1
  stable: null

diff:
  patch_paths:
    - plugin/intel_cpu_models/olmoe_cpu.py          # generated thin override
    - plugin/intel_cpu_models/_cpu_enablement.py    # shared mixin (framework)
  touches_core_sglang: false
  lint_clean: null

reproduce:
  env: "SGLANG_USE_CPU_ENGINE=1 SGLANG_EXTERNAL_MODEL_PACKAGE=intel_cpu_models PYTHONPATH=sglang-cpu-opt/plugin"
  accuracy_cmd: "python plugin/validate/accuracy_parity.py --model <path> --tp 1 --dtype bfloat16"
  gsm8k_cmd: "python plugin/validate/task_gsm8k.py --model <path> --data gsm8k_test.jsonl --tp 1 --num-questions 100"
  throughput_cmd: "OMP_NUM_THREADS=128 numactl --cpunodebind=0,1,2 --membind=0,1,2 python plugin/validate/throughput_bench.py --model <path> --config plugin/validate/fixtures/olmoe_config.json --tp 1 --batch 8 --input-len 512 --output-len 64"

thesis_metrics:
  wall_clock_hours: "<1 day incl. download + validation (2nd model, workflow reused unchanged)"
  automation_pct: "generic workflow; per-model code = 1 thin generated class"
  follow_ups: ["true FusedMoE CPU per-op profiling (replace dense proxy)", "mmlu"]
